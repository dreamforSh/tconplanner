# The overall format is standard TOML format, v0.5.0.
# https://github.com/toml-lang/toml
# The placeholders below are filled in by processResources from gradle.properties, so version, licence
# and authors have exactly one source of truth. They used to be hardcoded here and had drifted: this
# file claimed version 1.2.0 under the MIT licence while the build produced 1.7 under LGPL 3.0.
# Note this file is run through Groovy's template engine, so a literal dollar-brace anywhere in it -
# including in a comment - is evaluated as an expression and will fail the build.
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license="${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
logoFile="logo.png" #optional
#credits="Thanks for this example mod goes to Java" #optional
authors="${mod_authors}" #optional
# The description text for the mod (multi line!) (#mandatory)
description='''${mod_description}'''
[[dependencies.${mod_id}]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="tconstruct" #mandatory
    mandatory=true #mandatory
    versionRange="[3.9.1.5,)" #mandatory
    side="CLIENT"
