# A Forge access transformer only applies to the Minecraft artifact, never to another mod's jar, so the
# TinkerStationScreen entries that used to sit here could not match anything: two named Minecraft SRG
# fields (f_119921_, f_119922_) on a Tinkers class, and one named a Lombok annotation as if it were a
# field. EventListener reads what it needs through getCurrentLayout() and a guarded reflective lookup.
public net.minecraft.client.gui.screens.Screen *
public net.minecraft.client.gui.screens.Screen *()
public net.minecraft.client.gui.components.AbstractWidget *
public net.minecraft.client.gui.components.AbstractWidget *()
